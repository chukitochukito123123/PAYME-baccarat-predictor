<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔮 Prediccor Baccarat Stake.com</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: white; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; flex: 1; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 2.2em; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0,255,0,0.5); }
    .status { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; margin-bottom: 20px; text-align: center; font-size: 1.1em; }
    .prediction-card { 
      background: linear-gradient(145deg, #2d5a27, #1e4620); 
      border: 2px solid #4ade80; 
      border-radius: 20px; 
      padding: 25px; 
      margin-bottom: 25px; 
      text-align: center; 
      box-shadow: 0 10px 30px rgba(74,222,128,0.3);
    }
    .prediction { font-size: 2.5em; font-weight: bold; margin-bottom: 10px; }
    .confidence { font-size: 1.3em; color: #4ade80; }
    .history { background: rgba(0,0,0,0.4); border-radius: 10px; padding: 15px; }
    .history h3 { margin-bottom: 15px; text-align: center; }
    .history-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(50px, 1fr)); gap: 8px; }
    .result { 
      aspect-ratio: 1; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      font-size: 1.1em;
    }
    .result.banker { background: linear-gradient(145deg, #3b82f6, #1d4ed8); border: 2px solid #60a5fa; }
    .result.player { background: linear-gradient(145deg, #f59e0b, #d97706); border: 2px solid #fbbf24; }
    .result.tie { background: linear-gradient(145deg, #ec4899, #be185d); border: 2px solid #f472b6; }
    .refresh { text-align: center; margin-top: 20px; }
    .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #4ade80; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @media (max-width: 480px) { .container { padding: 10px; } .header h1 { font-size: 1.8em; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔮 Prediccor Baccarat</h1>
      <p>Stake.com Argentina - Actualización automática cada 30s</p>
    </div>
    
    <div id="status" class="status">🔄 Cargando predicción...</div>
    
    <div id="predictionCard" class="prediction-card" style="display: none;">
      <div id="prediction" class="prediction">Cargando...</div>
      <div id="confidence" class="confidence">0%</div>
      <div class="history">
        <h3>📊 Últimos 10 resultados</h3>
        <div id="historyGrid" class="history-grid"></div>
      </div>
    </div>
    
    <div id="refresh" class="refresh">
      <div class="spinner" style="display: none;"></div>
      <p id="timestamp"></p>
    </div>
  </div>

  <script>
    async function updatePrediction() {
      document.getElementById('refresh').querySelector('.spinner').style.display = 'block';
      try {
        const response = await fetch('/api/predictions');
        const data = await response.json();
        
        document.getElementById('status').textContent = data.lastUpdate;
        document.getElementById('refresh').querySelector('.spinner').style.display = 'none';
        
        if (data.predictions.length > 0) {
          const pred = data.predictions[0];
          document.getElementById('prediction').textContent = pred.prediction;
          document.getElementById('confidence').textContent = pred.confidence;
          document.getElementById('timestamp').textContent = pred.timestamp;
          
          const grid = document.getElementById('historyGrid');
          grid.innerHTML = '';
          pred.history.forEach(result => {
            const div = document.createElement('div');
            div.className = `result ${result.includes('B') || result.includes('Banker') ? 'banker' : 
                           result.includes('P') || result.includes('Player') ? 'player' : 'tie'}`;
            div.textContent = result.includes('B') ? 'B' : result.includes('P') ? 'P' : 'E';
            grid.appendChild(div);
          });
          
          document.getElementById('predictionCard').style.display = 'block';
        }
      } catch (error) {
        document.getElementById('status').textContent = `❌ Error: ${error.message}`;
      }
    }

    // Update cada 30s
    updatePrediction();
    setInterval(updatePrediction, 30000);
  </script>
</body>
</html>
